<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page Not Found</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background: #111827;
        color: #f9fafb;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
      }
      .card {
        background: #1f2937;
        padding: 40px;
        border-radius: 12px;
        text-align: center;
      }
      a {
        color: #fbbf24;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>404 - Page Not Found</h1>
      <p>The page you requested does not exist.</p>
      <p><a href="/">Go back home</a></p>
    </div>
  </body>
</html>
